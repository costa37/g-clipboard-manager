name: Validate versioned app

on:
  push:
    branches: [main]
    paths: [version.json]

permissions:
  contents: read

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test release rules
        run: |
          python3 scripts/test-release-metadata.py
          python3 scripts/test-appcast.py

      - name: Validate version change and release notes
        id: metadata
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/release-metadata.py

      - name: Build and test with assertions enabled
        if: steps.metadata.outputs.changed == 'true'
        run: |
          test "$(uname -m)" = arm64
          CONFIGURATION=debug bash scripts/build.sh
          dist/G-Clip.app/Contents/MacOS/GClip --self-test

      - name: Build release
        if: steps.metadata.outputs.changed == 'true'
        run: bash scripts/build.sh
